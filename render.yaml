services:
  # Memory Magic Spring Boot Backend Web Service
  - type: web
    name: memory-magic-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: memory-magic-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: memory-magic-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: memory-magic-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.netlify.app,http://localhost:3000,http://localhost:8080"

databases:
  # Render PostgreSQL Database
  - name: memory-magic-db
    databaseName: memory_magic_db
    user: memory_magic_user
    plan: free
    region: oregon
